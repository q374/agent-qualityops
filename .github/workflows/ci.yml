name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装后端依赖
        run: python -m pip install -r backend/requirements-dev.txt

      - name: 运行后端测试
        run: python -m pytest -q tests/backend --basetemp verify_tmp/pytest

      - name: 生成离线演示证据
        run: python scripts/generate_demo_evidence.py

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 前端生产构建
        working-directory: frontend
        run: npm run build
